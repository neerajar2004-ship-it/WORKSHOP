```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InstaLite</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-inner">

            <div class="brand">
                <span class="brand-icon">◎</span>
                <h2>InstaLite</h2>
            </div>

            <div class="nav-actions">
                <button class="nav-icon" title="Home">⌂</button>
                <button class="nav-icon" title="Messages">♡</button>
                <div class="nav-avatar">
                    <img
                        src="https://i.pravatar.cc/150?img=12"
                        alt="Profile"
                    >
                </div>
            </div>

        </div>
    </nav>


    <!-- MAIN -->
    <main class="container">

        <!-- CREATE POST -->
        <section class="create-card">

            <div class="create-header">
                <div class="profile-avatar">
                    <img
                        src="https://i.pravatar.cc/150?img=12"
                        alt="Profile"
                    >
                </div>

                <div>
                    <h3>Create Post</h3>
                    <p>Share a moment with your followers</p>
                </div>
            </div>

            <form id="post-form">

                <input
                    type="text"
                    id="caption-input"
                    placeholder="What's on your mind?"
                    autocomplete="off"
                    required
                >

                <div class="upload-area">

                    <label for="image-input" class="image-upload">

                        <span class="upload-icon">＋</span>

                        <span>
                            <strong>Add photo</strong>
                            <small>Choose an image from your device</small>
                        </span>

                    </label>

                    <input
                        type="file"
                        id="image-input"
                        accept="image/*"
                        required
                    >

                </div>

                <button type="submit" class="share-post-btn">
                    <span>✈</span>
                    Share Post
                </button>

            </form>

        </section>


        <!-- FEED -->
        <div id="feed"></div>

    </main>


    <script src="app.js"></script>

</body>
</html>
```
